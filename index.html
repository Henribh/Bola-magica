<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="styles.css">
    <title>Veja seu futuro</title>
</head>
<body>
    <div id="stars-container"></div>
    <div id="comets-container"></div>

    <main class="cabe">
        <h1>Faça sua pergunta para a bruxa</h1>
        <p>O ontem já foi, o agora é uma dádiva, mas o futuro você realmente quer saber?</p>
        <br>
        <p>Pergunte com responsabilidade...</p>
        <br>
        
        <div class="bola-container" id="containerBola">
            <div class="aura-natural"></div>
            
            <img id="bolaCristal" class="bola-cristal-img" src="assets/pexels-mariah-bushek-774911860-18911837.jpg" alt="Bola de Cristal">
        </div>
        
        <input type="text" id="perguntaInput" placeholder="Digite sua pergunta aqui...">
        
        <button id="btnSortear" onclick="sortear()">Ver o Futuro</button>
        
        <h2 id="resultado">Sua resposta aparecerá aqui...</h2>
    </main>

    <script src="js.js"></script>
</body>
</html>
